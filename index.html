<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交通服務 Demo</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #e5e5e5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .frame-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    .device-frame {
      width: 430px;
      height: 932px;
      border: 16px solid #000;
      border-radius: 50px;
      background: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
      margin-top: 20px;
      transform: scale(1);
      transform-origin: top center;
    }
    @media (max-width: 600px) {
      .device-frame {
        transform: scale(0.85);
      }
    }
    .device-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-align: center;
      position: relative;
      transition: all 0.3s ease-in-out;
    }
    .screen-content {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      position: relative;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fadeIn 0.4s ease-in-out;
      z-index: 1;
    }
    .hotspot-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    #voiceText {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
      opacity: 0;
      padding: 1em;
      box-sizing: border-box;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    button:not(.hotspot) {
      padding: 10px 20px;
      margin: 10px 5px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
    }
    #response {
      margin: 20px;
      color: #333;
      font-weight: bold;
      font-size: 0.9rem;
    }
    #modeToggle {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 0.9rem;
      padding: 6px 12px;
      background: #333;
      color: #fff;
      border-radius: 6px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

  <script>
    let currentMode = 'elder';

    const menus = {
      elder: [
        { label: '身分選擇', id: '身分選擇' },
        { label: '首頁', id: '首頁step1-content' },
        { label: '文字找地點', id: '確認地點頁面' },
        { label: '查看目的地1', id: '秀出畫面(地址)' },
        { label: '查看目的地2', id: '秀出畫面(地址)-1' },
        { label: '選擇交通工具', id: '偏好交通工具選擇step2' },
        { label: '大眾交通選擇', id: '選擇畫面-1' },
        { label: '前往公車站', id: 'step3-2-1公車_step1' },
        { label: '公車到站預估', id: 'step3-1-2公車_step2' },
        { label: '公路客運1', id: '公路客運＿詳細路程' },
        { label: '公路客運2', id: '公路客運＿選客運' },
        { label: '公路客運3', id: '公路客運＿購票' },
        { label: '公路客運4', id: '公路客運＿購票-1' },
        { label: '公路客運5', id: '公路客運＿購票付款' },
        { label: '計程車', id: 'step3-1-1計程車-長輩版' },
        { label: '一鍵求助', id: '分享位置給家人(長者版)' },
        { label: '求助結果', id: '長輩成功求助畫面' },
      ],

      family: [
        { label: '身分選擇', id: '身分選擇' },
        { label: '查看家人配對', id: '身分配對-家人畫面' },
        { label: '配對系統', id: '身分配對成功-家人畫面' },
        { label: '使用畫面1', id: '家人使用畫面-1' },
        { label: '使用畫面2', id: '家人使用畫面-2' },
        { label: '收到求助通知', id: '家人收到求助' },
        { label: '叫計程車', id: 'step3-1-1計程車-家人版' }
      ]
    };

    function grantPermissions() {
      const silentAudio = new Audio();
      silentAudio.src = '/static/silent.mp3'; // 請確保你有一個靜音 mp3 檔放在 static 資料夾中
      silentAudio.play().catch(err => console.warn('❌ 播放權限失敗', err));

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => {
            console.log("✅ 麥克風權限已授權");
            document.getElementById("consentBanner").style.display = "none";
          })
          .catch(err => {
            console.warn("❌ 無法取得麥克風權限", err);
            alert("請允許使用麥克風才能啟用語音功能。");
          });
      } else {
        alert("您的瀏覽器不支援語音功能。");
      }
    }

    function renderMenu() {
      const container = document.getElementById('menu-buttons');
      container.innerHTML = '';
      menus[currentMode].forEach(item => {
        const btn = document.createElement('button');
        btn.textContent = item.label;
        btn.onclick = () => {
          show(item.id);
          // 若為語音助理結束後導引的畫面，自動捲動至螢幕頂部
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        container.appendChild(btn);
      });
    }

    function toggleMode() {
      currentMode = currentMode === 'elder' ? 'family' : 'elder';
      document.getElementById('modeToggle').innerText = `目前模式：${currentMode === 'elder' ? '長輩' : '家人'}`;
      renderMenu();
    }

    function show(id) {
      document.querySelectorAll('.screen-content, .device-screen > img').forEach(el => {
        el.style.display = 'none';
      });
      const target = document.getElementById(id);
      if (target) target.style.display = 'block';
    }

    async function startAssistant() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      if (!recognition) {
        console.error("❌ 語音辨識 API 不被支援");
        alert("⚠️ 語音辨識功能不支援此瀏覽器");
        return;
      }

      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onspeechstart = () => console.log("🎙️ 偵測到開始說話");
      recognition.onspeechend = () => console.log("🔇 偵測到結束說話");

      recognition.onstart = () => {
        const voiceTextBox = document.getElementById("voiceText");
        const voiceMessage = document.getElementById("voiceMessage");
        voiceTextBox.style.opacity = 1;
        voiceMessage.textContent = "🎙️ 開始語音辨識中...";
      };

      recognition.onend = () => {
        const voiceMessage = document.getElementById("voiceMessage");
        voiceMessage.textContent = "正在處理回應...";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript.trim();
        const voiceTextBox = document.getElementById("voiceText");
        const voiceMessage = document.getElementById("voiceMessage");
        voiceTextBox.style.opacity = 1;
        voiceMessage.textContent = `📝 辨識結果：${transcript}`;

        try {
          const res = await fetch("/ai-assistant", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: transcript })
          });

          const data = await res.json();

          if (data.reply) {
            voiceMessage.textContent = `🧠 助理回覆：${data.reply}`;
          }

          if (data.audio_url) {
            const audio = new Audio(`${data.audio_url}?t=${Date.now()}`);
            audio.play().catch(err => console.warn("⚠️ 播放失敗", err));
          }

          if (data.command) {
            const cmd = data.command;
            if (cmd.action === "navigate" && cmd.target) {
              show(cmd.target);
            } else if (cmd.action === "fill_location" && cmd.from && cmd.to) {
              document.getElementById("fromLocation").value = cmd.from;
              document.getElementById("toLocation").value = cmd.to;
              show("確認地點頁面");
            }
          } else {
            const lowerQuery = transcript.toLowerCase();
            if (lowerQuery.includes("訂票") || lowerQuery.includes("客運") || lowerQuery.includes("購票")) {
              show("公路客運＿選客運");
            } else if (lowerQuery.includes("計程車")) {
              show("step3-1-1計程車-長輩版");
            } else if (lowerQuery.includes("求救")) {
              show("分享位置給家人(長者版)");
            }
          }

          const replyLength = (data.reply || "").length;
          const duration = 5000 + replyLength * 150;

          setTimeout(() => {
            voiceMessage.textContent = "請再次點擊語音按鈕進行操作";
            voiceTextBox.style.opacity = 0;
          }, duration);

        } catch (err) {
          console.error("⚠️ 語音助理錯誤：", err);
          alert("⚠️ 語音助理錯誤");
        }
      };

      recognition.start();
    }
    async function fetchData(endpoint) {
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        document.getElementById('response').innerText = JSON.stringify(data);
      } catch (err) {
        document.getElementById('response').innerText = '⚠️ 無法連線 API';
      }
    }

    renderMenu();
    async function runTicketScript() {
      try {
        const res = await fetch('https://ntnu-team-comp-app-ui.onrender.com/run-ticket', {
          method: 'POST'
        });
        const data = await res.json();
        alert(data.message || '✅ 訂票腳本執行成功');
      } catch (error) {
        alert('⚠️ 無法連接後端或腳本錯誤');
      }
    }

    function showFloatingMessage(message) {
      const voiceTextBox = document.getElementById("voiceText");
      const voiceMessage = document.getElementById("voiceMessage");
      voiceMessage.textContent = message;
      voiceTextBox.style.opacity = 1;
      setTimeout(() => {
        voiceTextBox.style.opacity = 0;
      }, 5000);
    }
  </script>

      const toInput = document.getElementById("toLocation");

      new google.maps.places.Autocomplete(fromInput, {
        types: ["geocode"],
        componentRestrictions: { country: "tw" }
      });

      new google.maps.places.Autocomplete(toInput, {
        types: ["geocode"],
        componentRestrictions: { country: "tw" }
      });
    }
    window.initAutocomplete = initAutocomplete;
  </script>
